<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Text Analyzer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
        integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Client-Side Text Analyzer</h1>
        </div>
    </header>
    
    <main class="container">
        <div class="row">
            <div class="col-sm-8">
                <form id="text-form">
                    <div class="form-group">
                        <label for="text_to_analyze">Enter Text to Analyze:</label>
                        <textarea class="form-control" id="text_to_analyze" name="text_to_analyze" 
                                rows="6" placeholder="Enter your text here..."></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Analyze Text</button>
                    </div>
                </form>
                
                <div id="error-message" class="alert alert-danger hidden"></div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-sm-12">
                <div id="text_output"></div>
            </div>
        </div>
    </main>
    
    <footer class="container">
        <hr>
        <p>&copy; 2025 YuKaiYeh - Student ID: 2003412 - CS-546 Lab 9</p>
    </footer>
    
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"
        integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"
        integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
